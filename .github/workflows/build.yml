name: Build Dobby arm64-v8a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dobby
        uses: actions/checkout@v4
        with:
          repository: jmpews/Dobby
          submodules: recursive

      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Patch Assembly Extensions for Clang
        run: |
          # Переименовываем все .asm файлы в .S, чтобы Clang понимал препроцессор
          find . -name "*.asm" | while read file; do
            mv "$file" "${file%.asm}.S"
          done
          
          # Заменяем .asm на .S внутри CMakeLists.txt скриптов
          find . -name "CMakeLists.txt" -exec sed -i 's/\.asm/\.S/g' {} +

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF

      - name: Compile Dobby
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Upload libdobby.a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdobby-arm64-v8a
          path: build/libdobby.a
