name: Build libdobby.a (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dobby
        uses: actions/checkout@v4
        with:
          repository: jmpews/Dobby
          path: Dobby

      - name: Patch and Remove bad ASM
        run: |
          cd Dobby
          # Удаляем файл, который ломает сборку на новых NDK
          find . -name "closure_bridge_arm64.asm" -delete
          # Создаем пустую заглушку вместо него
          mkdir -p source/TrampolineBridge/ClosureTrampolineBridge/arm64/
          echo " " > source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm

      - name: Set up NDK r25c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake
        run: |
          export NDK_PATH=${{ steps.setup-ndk.outputs.ndk-path }}
          cmake -S Dobby -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DCMAKE_C_COMPILER=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            -DCMAKE_CXX_COMPILER=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build
        run: cmake --build build -j$(nproc) --target dobby_static

      - name: Locate output
        run: find build -name "*.a"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdobby-arm64-v8a
          path: build/**/*.a
