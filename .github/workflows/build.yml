name: Build libdobby.a (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed Dobby fork
        uses: actions/checkout@v4
        with:
          repository: chiteroman/Dobby
          path: Dobby

      - name: Set up NDK r25c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Configure CMake
        run: |
          cmake -S Dobby -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DDOBBY_DEBUG=OFF

      - name: Build
        run: cmake --build build -j$(nproc) --target dobby_static

      - name: Locate output
        run: find build -name "*.a"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdobby-arm64-v8a
          path: build/**/*.a
